<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bjarne Lundqwist – CV</title>
  <meta name="description" content="Curriculum vitae för Bjarne Lundqwist: arbetslivserfarenhet, utbildning och kurser.">
  <link rel="stylesheet" href="\css\style.css">
</head>
<body>
  <a class="skip-link" href="#main">Hoppa till innehållet</a>

  <header class="hero">
    <div class="hero-inner">
      <div class="portrait" id="portrait" aria-hidden="false"></div>
      <div class="identity">
        <h1 id="name">Bjarne Lundqwist</h1>
        <p class="headline" id="headline"></p>
        <address class="contact" id="contact"></address>
      </div>
    </div>
  </header>

  <nav class="section-nav" aria-label="Sektioner">
    <div class="section-nav-inner">
      <a href="#arbete">Arbetslivserfarenhet</a>
      <a href="#utbildning">Utbildning</a>
      <a href="#kurser">Kurser</a>
    </div>
  </nav>

  <main id="main">
    <section id="arbete" aria-labelledby="arbete-h">
      <h2 id="arbete-h">Arbetslivserfarenhet</h2>
      <ol class="timeline" id="work"></ol>
    </section>

    <section id="utbildning" aria-labelledby="utbildning-h">
      <h2 id="utbildning-h">Utbildning</h2>
      <ol class="timeline" id="education"></ol>
    </section>

    <section id="kurser" aria-labelledby="kurser-h">
      <h2 id="kurser-h">Kurser</h2>
      <ol class="timeline" id="courses"></ol>
    </section>
  </main>

  <footer class="site-footer">
    <p id="footer-name"></p>
  </footer>

  <noscript><p class="notice">Den här sidan behöver JavaScript för att visa CV:t.</p></noscript>
  <script src="\scripts\script.js"></script>
</body>
</html>
